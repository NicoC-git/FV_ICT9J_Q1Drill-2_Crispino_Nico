<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q1 Drill 2</title>
    <style>
        body{
            font-family:'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif
        }
        section{
            background-color:#cac9d0;
            padding: 10px;
            margin: 15px;
            max-width: 600px;
            border-radius: 10px;
            box-shadow: 0 2px 5px;
            -moz-box-align: center;
            margin-left: auto;
            margin-right: auto;
        }
        input[type="submit"], select, textarea {
        width: 94%;
        padding: 15px;
        border:1px solid rgb(253, 252, 252);
        border-radius: 5px;
        text-align: center;
        }
        img{
            display: block;
            margin: auto;
            height: 100px;
            width: 100px;
            padding: 0px;
        }
        h1{
            text-align: center;
            color: #e3b23c;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        }
        p{
            text-align: center;
            color: rgb(235, 171, 76);
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        }
        body{
            background-color:#421994;
            img 
        }
    </style>
</head>
<body>
    <header>
    <h1>It's-A-Movie Rating</h1>
    <p>Welcome to It's-A-Movie Rating! Rate the most popular movies right now!</p>
    </header>

    <section>
        <form action="">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSKG34Ns06qRXm_3e_MXHeT3Ht6QCHiAGQd6pmh30SQsGxMbHQNiyYlUg20&s=10"  alt="movie logo">
            <label for="">Select a Movie</label>
                <select id="movies">
                    <option value="m1">Select</option>
                    <option value="m2">Spiderman: Brand New Day</option>
                    <option value="m3">Insidious: Out of the further</option>
                    <option value="m4">Obsession</option>
                </select>
                <br>
                <label for="genre">Genre/s</label>
                <br>
                <input type="checkbox" id="genre1" name="genre1">
                    <label for="genre1">Action</label>
                 
                <input type="checkbox" id="genre2" name="genre2">
                    <label for="genre2">Fantasy</label>
                    
                <input type="checkbox" id="genre3" name="genre3">
                    <label for="genre3">Horror</label>
                    
                <input type="checkbox" id="genre4" name="genre4">
                    <label for="genre4">Romance</label>
                   
                <input type="checkbox" id="genre5" name="genre5">
                    <label for="genre5">Comedy</label>
                    <br>
                    <br>
                 <label for="rate">Rating</label>
                <br>
                <input type="radio" id="rate1" name="rating">
                    <label for="rate1">🌟</label>
                 <input type="radio" id="rate2" name="rating">
                    <label for="rate2">🌟🌟</label>
                 <input type="radio" id="rate3" name="rating">
                    <label for="rate3">🌟🌟🌟</label>
                 <input type="radio" id="rate4" name="rating">
                    <label for="rate4">🌟🌟🌟🌟</label>
                 <input type="radio" id="rate5" name="rating">
                    <label for="rate5">🌟🌟🌟🌟🌟</label>
                <br><br>
                <textarea id="review" name="review" rows="4" cols="40" placeholder="Type Here"></textarea>
                <br>
                <input type="submit" id="submit" name="submit" value="Submit!">
                <br>
                For movie review tips, <a href="https://www.nyfa.edu/student-resources/9-tips-for-writing-a-film-review/" target="_blank">here</a> 
        </form>
    </section>
                <img src="https://cdn-icons-png.flaticon.com/512/2798/2798007.png" alt="movie logo glasses">

</body>
</html>
